spring.application.name=todo-api

# --- DB 연결 (JSP 시절 context.xml의 DataSource 설정에 해당) ---
# 메모리 DB라서 서버를 끄면 데이터가 사라진다. 학습 단계에서는 이게 편하다.
spring.datasource.url=jdbc:h2:mem:tododb
spring.datasource.username=sa
spring.datasource.password=

# --- H2 웹 콘솔: http://localhost:8080/h2-console ---
spring.h2.console.enabled=true

# --- JPA ---
# Entity 클래스를 보고 서버 시작 시 테이블을 새로 만든다 (CREATE TABLE을 직접 안 써도 됨).
spring.jpa.hibernate.ddl-auto=create
# JPA가 실행하는 SQL을 콘솔에 보여준다.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 화면(View) 렌더링 중에도 DB 연결을 붙잡아 두는 기능. JSON만 주는 API라 필요 없어서 끈다.
spring.jpa.open-in-view=false
